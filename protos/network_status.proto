syntax = "proto2";

import "google/protobuf/empty.proto";

package SessionApp;
option java_package= "dev.fanchao.session.protos";

message GetNetworkStatusRequest {
}

message NetworkPath {
  repeated string ipv4_addresses = 1;
}

message GetNetworkStatusResponse {
  oneof state {
    google.protobuf.Empty idle = 1;
    google.protobuf.Empty connecting = 2;
    NetworkPath connected = 3;
    string error = 4;
  }
}
