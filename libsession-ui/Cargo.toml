[package]
name = "session-ui"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
tokio = "1"
tracing = "0"
tracing-subscriber = "0"

[target.'cfg(target_os = "android")'.dependencies]
paranoid-android = "0"
session-ui-core = { path = "../libsession-ui-core" }
android_log-sys = "0.3.1"
jni-sys = "0"

# For non-android platforms, enable quic flag in session-ui-core
[target.'cfg(not(target_os = "android"))'.dependencies]
session-ui-core = { path = "../libsession-ui-core", features = [] }
